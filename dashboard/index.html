<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./installs.html" />
    <title>Java Web Console – Dashboard</title>
    <style>
      :root{ --bg:#0b1020; --text:#e6edf6; --muted:#9aa7bd; }
      html,body{height:100%}
      body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif}
      .card{max-width:760px;margin:24px;padding:20px;border:1px solid #1f2a44;border-radius:14px;background:#0f1628;box-shadow:0 8px 30px rgba(0,0,0,.28)}
      h1{margin:0 0 8px;font-size:22px}
      p{margin:0 0 12px;color:var(--muted)}
      a{color:#60a5fa}
    </style>
    <script>
      // JS redirect fallback
      window.addEventListener('DOMContentLoaded', ()=>{ window.location.replace('./installs.html'); });
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to Installs Dashboard…</h1>
      <p>If you are not redirected automatically, <a href="./installs.html">click here</a>.</p>
      <p style="font-size:12px;color:#7887a2;margin-top:8px">We simplified analytics to installs-only for privacy and clarity.</p>
    </div>
  </body>
</html>
